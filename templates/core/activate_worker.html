{% extends "base.html" %}{% block content %}<div class="card" style="max-width:480px;margin:auto"><h1>Activar conta PVA</h1><p>Olá {{ worker.first_name }}. Estabelecimento: {{ establishment.name }}.</p><p>Cria a tua palavra-passe pessoal para aceder à tua área de trabalhador.</p><form method="post">{% csrf_token %}<label>Nova palavra-passe</label><input type="password" name="password" minlength="8" required><label>Confirmar palavra-passe</label><input type="password" name="confirm" minlength="8" required><button type="submit">Activar a minha conta</button></form></div>{% endblock %}
